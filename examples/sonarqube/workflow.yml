# GitHub Actions workflow for SonarQube confidence badges
#
# Required secrets:
#   SONARQUBE_URL: Your SonarQube server URL (e.g., https://sonarqube.example.com)
#   SONARQUBE_TOKEN: API token for authentication
#
# This workflow:
# 1. Fetches metrics from SonarQube after analysis completes
# 2. Generates a confidence badge
# 3. Commits the badge to the repository (optional)
# 4. Fails the build if score drops below threshold

name: SonarQube Confidence Badge

on:
  # Run after SonarQube analysis completes
  workflow_run:
    workflows: ["SonarQube Analysis"]
    types: [completed]

  # Or run on push (if SonarQube analyzes on every push)
  push:
    branches: [main]

  # Manual trigger
  workflow_dispatch:

jobs:
  badge:
    runs-on: ubuntu-latest
    # Only run if analysis succeeded
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install confvis
        run: go install github.com/boinger/confvis/cmd/confvis@latest

      - name: Fetch SonarQube metrics
        env:
          SONARQUBE_URL: ${{ secrets.SONARQUBE_URL }}
          SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
        run: |
          confvis fetch sonarqube \
            --project ${{ github.repository }} \
            --branch ${{ github.ref_name }} \
            --output confidence.json \
            --verbose

      - name: Generate badge
        run: |
          confvis gauge \
            --config confidence.json \
            --output badge.svg \
            --fail-under 75

      - name: Generate flat badge (shields.io style)
        run: |
          confvis gauge \
            --config confidence.json \
            --output badge-flat.svg \
            --badge-type flat \
            --label "Quality"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: confidence-badges
          path: |
            confidence.json
            badge.svg
            badge-flat.svg

      # Optional: Commit badge to repository
      - name: Commit badge
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badge.svg badge-flat.svg
          git diff --staged --quiet || git commit -m "Update confidence badge [skip ci]"
          git push
