coverage:
  status:
    project:
      default:
        target: auto    # Use coverage of base commit as target
        threshold: 1%   # Allow 1% drop without failing
        if_ci_failed: error
    patch:
      default:
        target: 80%     # New code should have 80% coverage
        threshold: 0%

  # Require CI to pass before posting status
  require_ci_to_pass: true

# Ignore generated files and test utilities
ignore:
  - "**/*_test.go"
  - "**/testdata/**"
  - "cmd/confvis/main.go"  # Entry point, minimal logic
  - "internal/cli/filesystem.go"  # Thin pass-throughs to os.* - tested via mock FS

# Comment configuration for PRs
comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

# Flags for granular coverage tracking
flags:
  unit:
    paths:
      - internal/
    carryforward: true

# Don't wait too long for CI
codecov:
  notify:
    wait_for_ci: true
