name: 'confvis'
description: 'Generate confidence badges and dashboards from aggregated code metrics'
author: 'boinger'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  config:
    description: 'Path to confidence report (JSON/YAML)'
    required: true
  output:
    description: 'Output path for badge/report (required except for gate command)'
    required: false
  command:
    description: 'Command to run: gauge, gate, generate, or aggregate'
    default: 'gauge'
  format:
    description: 'Output format: svg, json, text, markdown, github-comment'
    default: 'svg'
  badge-type:
    description: 'Badge type: gauge, flat, or sparkline'
    default: 'gauge'
  style:
    description: 'Color style: github, minimal, corporate, high-contrast'
    default: 'github'
  dark:
    description: 'Use dark mode colors'
    default: 'false'
  fail-under:
    description: 'Fail if score is below this threshold'
    default: '0'
  compare-baseline:
    description: 'Compare against stored baseline'
    default: 'false'
  fail-on-regression:
    description: 'Fail if score decreased from baseline'
    default: 'false'
  save-baseline:
    description: 'Save current score as baseline after generation'
    default: 'false'
  create-check:
    description: 'Create GitHub Check Run with results'
    default: 'false'
  check-name:
    description: 'Name for the GitHub Check Run'
    default: 'Confidence Score'
  post-comment:
    description: 'Post confidence report as PR comment'
    default: 'false'
  comment-mode:
    description: 'Comment mode: create, update, or replace'
    default: 'update'
  history-auto:
    description: 'Auto-manage sparkline history (for sparkline badge-type)'
    default: 'false'
  factor-threshold:
    description: 'Per-factor thresholds, comma-separated Name:threshold (gate command)'
    default: ''
  compare:
    description: 'Explicit baseline file path for comparison (gate command)'
    default: ''
  baseline-ref:
    description: 'Git ref for baseline (gate command)'
    default: ''
  baseline-file:
    description: 'File path for baseline (gate command)'
    default: ''
  input-format:
    description: 'Input format: auto, json, or yaml (gate command)'
    default: 'auto'
  quiet:
    description: 'Suppress non-error output (gate command)'
    default: 'false'
  version:
    description: 'confvis version to use (default: latest)'
    default: 'latest'

outputs:
  score:
    description: 'The confidence score (0-100)'
    value: ${{ steps.confvis.outputs.score }}
  passed:
    description: 'Whether the score met the threshold (true/false)'
    value: ${{ steps.confvis.outputs.passed }}
  delta:
    description: 'Score change from baseline (if compare-baseline enabled)'
    value: ${{ steps.confvis.outputs.delta }}
  gate_result:
    description: 'Gate result: pass or fail (gate command only)'
    value: ${{ steps.confvis.outputs.gate_result }}
  gate_score:
    description: 'Gate score (gate command only)'
    value: ${{ steps.confvis.outputs.gate_score }}

runs:
  using: 'composite'
  steps:
    - name: Determine OS and architecture
      id: platform
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        case "$RUNNER_OS" in
          Linux)  echo "os=linux" >> $GITHUB_OUTPUT ;;
          macOS)  echo "os=darwin" >> $GITHUB_OUTPUT ;;
          Windows) echo "os=windows" >> $GITHUB_OUTPUT ;;
          *) echo "::error::Unsupported OS: $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   echo "arch=amd64" >> $GITHUB_OUTPUT ;;
          ARM64) echo "arch=arm64" >> $GITHUB_OUTPUT ;;
          *) echo "::error::Unsupported architecture: $RUNNER_ARCH"; exit 1 ;;
        esac

    - name: Install confvis
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        PLATFORM_OS: ${{ steps.platform.outputs.os }}
        PLATFORM_ARCH: ${{ steps.platform.outputs.arch }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        VERSION="$INPUT_VERSION"
        OS="$PLATFORM_OS"
        ARCH="$PLATFORM_ARCH"

        if [ "$VERSION" = "latest" ]; then
          # Get latest release tag from GitHub API
          LATEST_TAG=$(curl -sSL --proto =https "https://api.github.com/repos/boinger/confvis/releases/latest" | jq -r '.tag_name')
          VERSION_NUM="${LATEST_TAG#v}"
          DOWNLOAD_URL="https://github.com/boinger/confvis/releases/download/${LATEST_TAG}/confvis_${VERSION_NUM}_${OS}_${ARCH}.tar.gz"
        else
          # Strip 'v' prefix if present for filename, keep for tag
          VERSION_NUM="${VERSION#v}"
          TAG="v${VERSION_NUM}"
          DOWNLOAD_URL="https://github.com/boinger/confvis/releases/download/${TAG}/confvis_${VERSION_NUM}_${OS}_${ARCH}.tar.gz"
        fi

        echo "Downloading confvis from: $DOWNLOAD_URL"

        # Download and extract
        if [ "$OS" = "windows" ]; then
          curl -sSL --proto =https "${DOWNLOAD_URL%.tar.gz}.zip" -o /tmp/confvis.zip
          unzip -q /tmp/confvis.zip -d /tmp
          mv /tmp/confvis.exe "$ACTION_PATH/confvis.exe"
          echo "$ACTION_PATH" >> $GITHUB_PATH
        else
          curl -sSL --proto =https "$DOWNLOAD_URL" | tar xz -C /tmp
          chmod +x /tmp/confvis
          sudo mv /tmp/confvis /usr/local/bin/confvis
        fi

        confvis --version

    - name: Run confvis
      id: confvis
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_BADGE_TYPE: ${{ inputs.badge-type }}
        INPUT_STYLE: ${{ inputs.style }}
        INPUT_DARK: ${{ inputs.dark }}
        INPUT_FAIL_UNDER: ${{ inputs.fail-under }}
        INPUT_COMPARE_BASELINE: ${{ inputs.compare-baseline }}
        INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        INPUT_HISTORY_AUTO: ${{ inputs.history-auto }}
        INPUT_FACTOR_THRESHOLD: ${{ inputs.factor-threshold }}
        INPUT_COMPARE: ${{ inputs.compare }}
        INPUT_BASELINE_REF: ${{ inputs.baseline-ref }}
        INPUT_BASELINE_FILE: ${{ inputs.baseline-file }}
        INPUT_INPUT_FORMAT: ${{ inputs.input-format }}
        INPUT_QUIET: ${{ inputs.quiet }}
      run: |
        # Build command arguments
        ARGS=()
        ARGS+=("-c" "$INPUT_CONFIG")

        # Output path is required for all commands except gate
        if [ "$INPUT_COMMAND" != "gate" ]; then
          if [ -z "$INPUT_OUTPUT" ]; then
            echo "::error::output is required for '$INPUT_COMMAND' command"
            exit 1
          fi
          ARGS+=("-o" "$INPUT_OUTPUT")
        fi

        # Add format for gauge command
        if [ "$INPUT_COMMAND" = "gauge" ]; then
          ARGS+=("--format" "$INPUT_FORMAT")
          ARGS+=("--badge-type" "$INPUT_BADGE_TYPE")
          ARGS+=("--style" "$INPUT_STYLE")

          if [ "$INPUT_DARK" = "true" ]; then
            ARGS+=("--dark")
          fi

          if [ "$INPUT_FAIL_UNDER" != "0" ]; then
            ARGS+=("--fail-under" "$INPUT_FAIL_UNDER")
          fi

          if [ "$INPUT_COMPARE_BASELINE" = "true" ]; then
            ARGS+=("--compare-baseline")
          fi

          if [ "$INPUT_FAIL_ON_REGRESSION" = "true" ]; then
            ARGS+=("--fail-on-regression")
          fi

          if [ "$INPUT_HISTORY_AUTO" = "true" ]; then
            ARGS+=("--history-auto")
          fi

        elif [ "$INPUT_COMMAND" = "gate" ]; then
          if [ "$INPUT_INPUT_FORMAT" != "auto" ]; then
            ARGS+=("--input-format" "$INPUT_INPUT_FORMAT")
          fi

          if [ "$INPUT_FAIL_UNDER" != "0" ]; then
            ARGS+=("--fail-under" "$INPUT_FAIL_UNDER")
          fi

          if [ "$INPUT_COMPARE_BASELINE" = "true" ]; then
            ARGS+=("--compare-baseline")
          fi

          if [ "$INPUT_FAIL_ON_REGRESSION" = "true" ]; then
            ARGS+=("--fail-on-regression")
          fi

          if [ -n "$INPUT_COMPARE" ]; then
            ARGS+=("--compare" "$INPUT_COMPARE")
          fi

          if [ -n "$INPUT_BASELINE_REF" ]; then
            ARGS+=("--baseline-ref" "$INPUT_BASELINE_REF")
          fi

          if [ -n "$INPUT_BASELINE_FILE" ]; then
            ARGS+=("--baseline-file" "$INPUT_BASELINE_FILE")
          fi

          # Split comma-separated factor thresholds into individual flags
          if [ -n "$INPUT_FACTOR_THRESHOLD" ]; then
            IFS=',' read -ra THRESHOLDS <<< "$INPUT_FACTOR_THRESHOLD"
            for t in "${THRESHOLDS[@]}"; do
              # Trim whitespace
              t="$(echo "$t" | xargs)"
              if [ -n "$t" ]; then
                ARGS+=("--factor-threshold" "$t")
              fi
            done
          fi

          if [ "$INPUT_QUIET" = "true" ]; then
            ARGS+=("--quiet")
          fi
        fi

        # Run the command and emit JSON metadata for outputs
        EMIT_JSON="/tmp/confvis-output.json"

        # Add --emit-json only for gauge command (other commands don't support it)
        if [ "$INPUT_COMMAND" = "gauge" ]; then
          ARGS+=("--emit-json" "$EMIT_JSON")
        fi

        echo "Running: confvis $INPUT_COMMAND ${ARGS[*]}"

        # Capture exit code so we can extract outputs even on failure
        EXIT_CODE=0
        confvis "$INPUT_COMMAND" "${ARGS[@]}" || EXIT_CODE=$?

        # Extract outputs based on command type
        if [ "$INPUT_COMMAND" = "gate" ]; then
          # Gate writes gate_result/gate_score directly to $GITHUB_OUTPUT.
          # Read them back to also populate the generic score/passed outputs.
          GATE_RESULT=$(grep -m1 '^gate_result=' "$GITHUB_OUTPUT" | cut -d= -f2 || true)
          GATE_SCORE=$(grep -m1 '^gate_score=' "$GITHUB_OUTPUT" | cut -d= -f2 || true)

          # Map gate outputs to generic outputs for downstream compatibility
          echo "score=${GATE_SCORE}" >> $GITHUB_OUTPUT
          if [ "$GATE_RESULT" = "pass" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi
          echo "delta=" >> $GITHUB_OUTPUT

          echo "::notice::Gate Result: ${GATE_RESULT} (score: ${GATE_SCORE}%)"
        else
          # Extract outputs from emitted JSON (gauge command)
          if [ -f "$EMIT_JSON" ]; then
            SCORE=$(jq -r '.score // empty' "$EMIT_JSON")
            PASSED=$(jq -r '.passed // empty' "$EMIT_JSON")
            DELTA=$(jq -r '.delta // empty' "$EMIT_JSON")
          else
            SCORE=""
            PASSED=""
            DELTA=""
          fi

          echo "score=${SCORE}" >> $GITHUB_OUTPUT
          echo "passed=${PASSED}" >> $GITHUB_OUTPUT
          echo "delta=${DELTA}" >> $GITHUB_OUTPUT

          echo "::notice::Confidence Score: ${SCORE}% (passed: ${PASSED})"
        fi

        exit $EXIT_CODE

    - name: Save baseline
      if: inputs.save-baseline == 'true'
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
      run: |
        echo "Saving baseline..."
        confvis baseline save -c "$INPUT_CONFIG"

    - name: Create GitHub Check
      if: inputs.create-check == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_CHECK_NAME: ${{ inputs.check-name }}
      run: |
        echo "Creating GitHub Check Run..."
        confvis check github -c "$INPUT_CONFIG" --name "$INPUT_CHECK_NAME"

    - name: Post PR Comment
      if: inputs.post-comment == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_COMMENT_MODE: ${{ inputs.comment-mode }}
      run: |
        echo "Posting PR comment..."
        confvis comment github -c "$INPUT_CONFIG" --mode "$INPUT_COMMENT_MODE"
