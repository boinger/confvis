name: 'confvis'
description: 'Generate confidence badges and dashboards from aggregated code metrics'
author: 'boinger'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  config:
    description: 'Path to confidence report (JSON/YAML)'
    required: true
  output:
    description: 'Output path for badge/report'
    required: true
  command:
    description: 'Command to run: gauge, generate, or aggregate'
    default: 'gauge'
  format:
    description: 'Output format: svg, json, text, markdown, github-comment'
    default: 'svg'
  badge-type:
    description: 'Badge type: gauge, flat, or sparkline'
    default: 'gauge'
  style:
    description: 'Color style: github, minimal, corporate, high-contrast'
    default: 'github'
  dark:
    description: 'Use dark mode colors'
    default: 'false'
  fail-under:
    description: 'Fail if score is below this threshold'
    default: '0'
  compare-baseline:
    description: 'Compare against stored baseline'
    default: 'false'
  fail-on-regression:
    description: 'Fail if score decreased from baseline'
    default: 'false'
  save-baseline:
    description: 'Save current score as baseline after generation'
    default: 'false'
  create-check:
    description: 'Create GitHub Check Run with results'
    default: 'false'
  check-name:
    description: 'Name for the GitHub Check Run'
    default: 'Confidence Score'
  history-auto:
    description: 'Auto-manage sparkline history (for sparkline badge-type)'
    default: 'false'
  version:
    description: 'confvis version to use (default: latest)'
    default: 'latest'

outputs:
  score:
    description: 'The confidence score (0-100)'
    value: ${{ steps.confvis.outputs.score }}
  passed:
    description: 'Whether the score met the threshold (true/false)'
    value: ${{ steps.confvis.outputs.passed }}
  delta:
    description: 'Score change from baseline (if compare-baseline enabled)'
    value: ${{ steps.confvis.outputs.delta }}

runs:
  using: 'composite'
  steps:
    - name: Determine OS and architecture
      id: platform
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        case "$RUNNER_OS" in
          Linux)  echo "os=linux" >> $GITHUB_OUTPUT ;;
          macOS)  echo "os=darwin" >> $GITHUB_OUTPUT ;;
          Windows) echo "os=windows" >> $GITHUB_OUTPUT ;;
          *) echo "::error::Unsupported OS: $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   echo "arch=amd64" >> $GITHUB_OUTPUT ;;
          ARM64) echo "arch=arm64" >> $GITHUB_OUTPUT ;;
          *) echo "::error::Unsupported architecture: $RUNNER_ARCH"; exit 1 ;;
        esac

    - name: Install confvis
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        PLATFORM_OS: ${{ steps.platform.outputs.os }}
        PLATFORM_ARCH: ${{ steps.platform.outputs.arch }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        VERSION="$INPUT_VERSION"
        OS="$PLATFORM_OS"
        ARCH="$PLATFORM_ARCH"

        if [ "$VERSION" = "latest" ]; then
          # Get latest release tag from GitHub API
          LATEST_TAG=$(curl -sSL --proto =https "https://api.github.com/repos/boinger/confvis/releases/latest" | jq -r '.tag_name')
          VERSION_NUM="${LATEST_TAG#v}"
          DOWNLOAD_URL="https://github.com/boinger/confvis/releases/download/${LATEST_TAG}/confvis_${VERSION_NUM}_${OS}_${ARCH}.tar.gz"
        else
          # Strip 'v' prefix if present for filename, keep for tag
          VERSION_NUM="${VERSION#v}"
          TAG="v${VERSION_NUM}"
          DOWNLOAD_URL="https://github.com/boinger/confvis/releases/download/${TAG}/confvis_${VERSION_NUM}_${OS}_${ARCH}.tar.gz"
        fi

        echo "Downloading confvis from: $DOWNLOAD_URL"

        # Download and extract
        if [ "$OS" = "windows" ]; then
          curl -sSL --proto =https "${DOWNLOAD_URL%.tar.gz}.zip" -o /tmp/confvis.zip
          unzip -q /tmp/confvis.zip -d /tmp
          mv /tmp/confvis.exe "$ACTION_PATH/confvis.exe"
          echo "$ACTION_PATH" >> $GITHUB_PATH
        else
          curl -sSL --proto =https "$DOWNLOAD_URL" | tar xz -C /tmp
          chmod +x /tmp/confvis
          sudo mv /tmp/confvis /usr/local/bin/confvis
        fi

        confvis --version || echo "confvis installed"

    - name: Run confvis
      id: confvis
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_BADGE_TYPE: ${{ inputs.badge-type }}
        INPUT_STYLE: ${{ inputs.style }}
        INPUT_DARK: ${{ inputs.dark }}
        INPUT_FAIL_UNDER: ${{ inputs.fail-under }}
        INPUT_COMPARE_BASELINE: ${{ inputs.compare-baseline }}
        INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        INPUT_HISTORY_AUTO: ${{ inputs.history-auto }}
      run: |
        # Build command arguments
        ARGS=()
        ARGS+=("-c" "$INPUT_CONFIG")
        ARGS+=("-o" "$INPUT_OUTPUT")

        # Add format for gauge command
        if [ "$INPUT_COMMAND" = "gauge" ]; then
          ARGS+=("--format" "$INPUT_FORMAT")
          ARGS+=("--badge-type" "$INPUT_BADGE_TYPE")
          ARGS+=("--style" "$INPUT_STYLE")

          if [ "$INPUT_DARK" = "true" ]; then
            ARGS+=("--dark")
          fi

          if [ "$INPUT_FAIL_UNDER" != "0" ]; then
            ARGS+=("--fail-under" "$INPUT_FAIL_UNDER")
          fi

          if [ "$INPUT_COMPARE_BASELINE" = "true" ]; then
            ARGS+=("--compare-baseline")
          fi

          if [ "$INPUT_FAIL_ON_REGRESSION" = "true" ]; then
            ARGS+=("--fail-on-regression")
          fi

          if [ "$INPUT_HISTORY_AUTO" = "true" ]; then
            ARGS+=("--history-auto")
          fi
        fi

        # Run the command and capture JSON output for extracting values
        echo "Running: confvis $INPUT_COMMAND ${ARGS[*]}"
        confvis "$INPUT_COMMAND" "${ARGS[@]}"

        # Get score data as JSON for outputs
        JSON_OUTPUT=$(confvis gauge -c "$INPUT_CONFIG" -o - --format json 2>/dev/null || echo '{}')

        SCORE=$(echo "$JSON_OUTPUT" | jq -r '.score // empty')
        PASSED=$(echo "$JSON_OUTPUT" | jq -r '.passed // empty')
        DELTA=$(echo "$JSON_OUTPUT" | jq -r '.delta // empty')

        echo "score=${SCORE}" >> $GITHUB_OUTPUT
        echo "passed=${PASSED}" >> $GITHUB_OUTPUT
        echo "delta=${DELTA}" >> $GITHUB_OUTPUT

        echo "::notice::Confidence Score: ${SCORE}% (passed: ${PASSED})"

    - name: Save baseline
      if: inputs.save-baseline == 'true'
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
      run: |
        echo "Saving baseline..."
        confvis baseline save -c "$INPUT_CONFIG"

    - name: Create GitHub Check
      if: inputs.create-check == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_CHECK_NAME: ${{ inputs.check-name }}
      run: |
        echo "Creating GitHub Check Run..."
        confvis check github -c "$INPUT_CONFIG" --name "$INPUT_CHECK_NAME"
