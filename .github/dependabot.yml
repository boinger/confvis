version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      # init/autobuild/analyze/upload-sarif must move together; split PRs fail CodeQL
      codeql:
        patterns:
          - "github/codeql-action*"
