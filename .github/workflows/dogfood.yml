name: Confidence Badge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'  # Daily at 8 AM UTC
  workflow_dispatch:

jobs:
  dogfood:
    name: Generate Confidence Badge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6
        with:
          go-version: '1.23'

      - name: Build confvis
        run: go build -o confvis ./cmd/confvis

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Fetch Codecov metrics
        run: ./confvis fetch codecov -p boinger/confvis -o coverage.json
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Fetch SonarCloud metrics
        run: ./confvis fetch sonarqube -p boinger_confvis -o quality.json
        env:
          SONARQUBE_URL: https://sonarcloud.io
          SONARQUBE_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: Fetch CI metrics
        run: ./confvis fetch github-actions -p boinger/confvis --workflow ci.yml --count 30 -o ci.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Fetch Trivy security metrics
        run: ./confvis fetch trivy -p . -o security.json
        continue-on-error: true

      - name: Aggregate confidence (with available sources)
        id: aggregate
        run: |
          # Build list of available config files
          CONFIGS=""
          if [ -f coverage.json ]; then CONFIGS="$CONFIGS -c coverage.json:30"; fi
          if [ -f quality.json ]; then CONFIGS="$CONFIGS -c quality.json:30"; fi
          if [ -f ci.json ]; then CONFIGS="$CONFIGS -c ci.json:20"; fi
          if [ -f security.json ]; then CONFIGS="$CONFIGS -c security.json:20"; fi

          if [ -z "$CONFIGS" ]; then
            echo "No metric files available, skipping aggregation"
            echo "has_metrics=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_metrics=true" >> "$GITHUB_OUTPUT"

          # Generate badge and dashboard (fail-under from .confvis.yaml)
          ./confvis aggregate $CONFIGS -o ./badges --badge-type flat --icon "M7 1 A6 6 0 1 1 4 1.8 L7 7 Z" --label confvis

      - name: Create aggregate confidence.json
        if: steps.aggregate.outputs.has_metrics == 'true'
        run: |
          # Create aggregate report JSON for check and baseline commands
          # Build factors array from available source files
          FACTORS='[]'

          for pair in "coverage.json:30" "quality.json:30" "ci.json:20" "security.json:20"; do
            file="${pair%:*}"
            weight="${pair#*:}"
            if [ -f "$file" ]; then
              title=$(jq -r '.title // "Unknown"' "$file")
              score=$(jq -r '.score // 0' "$file")
              FACTORS=$(echo "$FACTORS" | jq \
                --arg name "$title" \
                --arg score "$score" \
                --arg weight "$weight" \
                '. + [{"name": $name, "score": ($score | tonumber), "weight": ($weight | tonumber)}]')
            fi
          done

          # Calculate weighted average (handle empty array)
          if [ "$FACTORS" = "[]" ]; then
            SCORE=0
          else
            SCORE=$(echo "$FACTORS" | jq '
              if length == 0 then 0
              else ([.[] | .score * .weight] | add) / ([.[] | .weight] | add) | floor
              end')
          fi

          # Create the aggregate JSON
          echo "$FACTORS" | jq \
            --argjson score "$SCORE" \
            '{
              "title": "confvis Confidence",
              "score": $score,
              "threshold": 80,
              "factors": .
            }' > badges/confidence.json

          echo "Aggregate score: $SCORE"

      - name: Generate sparkline badge
        if: steps.aggregate.outputs.has_metrics == 'true'
        run: |
          # Generate sparkline showing score trend over time
          # Uses --history-auto to store history in git refs
          ./confvis gauge -c badges/confidence.json -o badges/sparkline.svg --badge-type sparkline --history-auto
        continue-on-error: true

      - name: Compare against baseline (PRs only)
        if: steps.aggregate.outputs.has_metrics == 'true' && github.event_name == 'pull_request'
        run: |
          # Compare current score against stored baseline
          # Fail if score regressed
          ./confvis gauge -c badges/confidence.json -o - -f text --compare-baseline --fail-on-regression
        continue-on-error: true

      - name: Save baseline (main only)
        if: steps.aggregate.outputs.has_metrics == 'true' && github.ref == 'refs/heads/main'
        run: ./confvis baseline save -c badges/confidence.json

      - name: Create GitHub Check
        if: steps.aggregate.outputs.has_metrics == 'true'
        run: ./confvis check github -c badges/confidence.json --name "Confidence Score"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit badge
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        with:
          commit_message: "chore: update confidence badge [skip ci]"
          file_pattern: "badges/*"
