name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.25'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Update major version tag for GitHub Action users (e.g., @v1)
      - name: Update major version tag
        env:
          GH_REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GH_REF#refs/tags/}"
          MAJOR_VERSION=$(echo "$TAG" | cut -d. -f1)
          SHA=$(git rev-parse HEAD)

          echo "Updating $MAJOR_VERSION to point to $TAG ($SHA)"

          # Try to update existing tag ref via API (avoids workflows scope requirement)
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR_VERSION}" \
            -X PATCH -f sha="$SHA" -F force=true 2>/dev/null; then
            # Tag doesn't exist yet, create it
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -X POST -f ref="refs/tags/${MAJOR_VERSION}" -f sha="$SHA"
          fi

          echo "Updated $MAJOR_VERSION tag to point to $TAG"
