name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.26'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Update major version tag for GitHub Action users (e.g., @v1)
      - name: Update major version tag
        env:
          GH_REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GH_REF#refs/tags/}"
          MAJOR_VERSION=$(echo "$TAG" | cut -d. -f1)
          SHA=$(git rev-parse HEAD)

          echo "Updating $MAJOR_VERSION to point to $TAG ($SHA)"

          # Try to update existing tag ref via API (avoids workflows scope requirement)
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${MAJOR_VERSION}" \
            -X PATCH -f sha="$SHA" -F force=true 2>/dev/null; then
            # Tag doesn't exist yet, create it
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -X POST -f ref="refs/tags/${MAJOR_VERSION}" -f sha="$SHA"
          fi

          echo "Updated $MAJOR_VERSION tag to point to $TAG"
