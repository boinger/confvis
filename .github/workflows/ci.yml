name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.26']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ matrix.go }}

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic -json ./... > test-report.json

      - name: Check coverage threshold
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{gsub(/%/,""); print int($3)}')
          echo "Coverage: $coverage%"
          if [ $coverage -lt 80 ]; then
            echo "Coverage $coverage% is below threshold of 80%"
            exit 1
          fi

      - name: Check for CODECOV_TOKEN
        id: check-codecov
        if: matrix.go == '1.26'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Skipping Codecov upload - CODECOV_TOKEN not available"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        if: matrix.go == '1.26' && steps.check-codecov.outputs.skip != 'true'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2
        if: matrix.go == '1.26'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.out
          format: golang
          fail-on-error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.11.3
          args: --config .golangci.yml

  sonarcloud:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check for SONAR_TOKEN
        id: check-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Skipping SonarCloud scan - SONAR_TOKEN not available"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        if: steps.check-token.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        if: steps.check-token.outputs.skip != 'true'
        with:
          go-version: '1.26'

      - name: Run tests with coverage
        if: steps.check-token.outputs.skip != 'true'
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Get version from git
        if: steps.check-token.outputs.skip != 'true'
        id: version
        run: |
          # Only use exact tag matches so non-release commits don't get versions
          VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: SonarCloud Scan
        if: steps.check-token.outputs.skip != 'true'
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            ${{ steps.version.outputs.version != '' && format('-Dsonar.projectVersion={0}', steps.version.outputs.version) || '' }}
