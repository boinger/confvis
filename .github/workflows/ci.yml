name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.23']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6
        with:
          go-version: ${{ matrix.go }}

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic -json ./... > test-report.json

      - name: Check coverage threshold
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{gsub(/%/,""); print int($3)}')
          echo "Coverage: $coverage%"
          if [ $coverage -lt 80 ]; then
            echo "Coverage $coverage% is below threshold of 80%"
            exit 1
          fi

      - name: Check for CODECOV_TOKEN
        id: check-codecov
        if: matrix.go == '1.23'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Skipping Codecov upload - CODECOV_TOKEN not available"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        if: matrix.go == '1.23' && steps.check-codecov.outputs.skip != 'true'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2
        if: matrix.go == '1.23'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.out
          format: golang

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6
        with:
          go-version: '1.23'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.8.0
          args: --config .golangci.yml

  sonarcloud:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check for SONAR_TOKEN
        id: check-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Skipping SonarCloud scan - SONAR_TOKEN not available"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: steps.check-token.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6
        if: steps.check-token.outputs.skip != 'true'
        with:
          go-version: '1.23'

      - name: Run tests with coverage
        if: steps.check-token.outputs.skip != 'true'
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Get version from git
        if: steps.check-token.outputs.skip != 'true'
        id: version
        run: |
          # Only use exact tag matches so non-release commits don't get versions
          VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: SonarCloud Scan
        if: steps.check-token.outputs.skip != 'true'
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            ${{ steps.version.outputs.version != '' && format('-Dsonar.projectVersion={0}', steps.version.outputs.version) || '' }}
